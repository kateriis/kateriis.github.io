<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сторінку не знайдено — Катерина Качур</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eaeaea">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: 'Inter'; font-weight: 400 700; font-display: swap; src: url('/assets/fonts/Inter-cyrillic.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Inter'; font-weight: 400 700; font-display: swap; src: url('/assets/fonts/Inter-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Inter'; font-weight: 400 700; font-display: swap; src: url('/assets/fonts/Inter-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Inter Tight'; font-weight: 400 500; font-display: swap; src: url('/assets/fonts/InterTight-cyrillic.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Inter Tight'; font-weight: 400 500; font-display: swap; src: url('/assets/fonts/InterTight-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  --bg: #eaeaea; --surface: #ffffff; --surface-2: #f6f6f7; --ink: #000000;
  --ink-70: rgba(0, 0, 0, .7); --ink-50: rgba(0, 0, 0, .6); --line: rgba(0, 0, 0, .1);
  --display: "Inter", system-ui, -apple-system, sans-serif; --tight: "Inter Tight", "Inter", system-ui, sans-serif;
  --r-md: 8px; --ease: cubic-bezier(.2, .7, .2, 1); --gutter: 16px;
  color-scheme: light;
}
@media (min-width: 700px) { :root { --gutter: 32px; } }
@media (min-width: 1024px) { :root { --gutter: 48px; } }
@media (min-width: 1440px) { :root { --gutter: 80px; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.2 var(--display); letter-spacing: -.05em; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.page { max-width: 1760px; margin: 0 auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.eyebrow { font: 500 13px/1 var(--tight); text-transform: uppercase; letter-spacing: -.03em; }
.topbar { display: flex; align-items: center; gap: 12px; height: 68px; border-bottom: 1px solid var(--line); }
.topbar a { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.topbar svg { height: 20px; width: auto; display: block; }
.topbar .sep { width: 1px; height: 20px; background: var(--line); }
.doc { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 72px; padding-block: 72px 120px; }
.doc-aside { display: grid; gap: 20px; align-content: start; justify-items: start; position: sticky; top: 24px; align-self: start; }
.doc-aside .eyebrow { color: var(--ink-50); }
h1 { margin: 0; font: 700 clamp(44px, 6vw, 96px)/.88 var(--display); letter-spacing: -.05em; text-transform: uppercase; }
.meta { margin: 0; color: var(--ink-50); }
.btn { display: inline-flex; gap: 2px; height: 48px; text-decoration: none; }
.btn > span { display: inline-flex; align-items: center; border-radius: var(--r-md); background: var(--surface); transition: background .3s var(--ease); }
.btn .arrow { width: 48px; justify-content: center; }
.btn .arrow svg { width: 18px; height: 18px; transition: transform .3s var(--ease); }
.btn .label { padding: 0 22px; font: 500 15px/1 var(--tight); letter-spacing: .02em; text-transform: uppercase; }
.btn:hover > span { background: var(--surface-2); }
.btn:hover .arrow svg { transform: translateX(-3px); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: var(--r-md); }
.body { display: grid; gap: 40px; max-width: 64ch; }
.lead { margin: 0; font-size: 22px; line-height: 1.25; }
section { display: grid; gap: 12px; padding-top: 24px; border-top: 1px solid var(--line); }
h2 { margin: 0; font: 500 24px/1.1 var(--display); letter-spacing: -.05em; }
p, li { color: var(--ink-70); font-size: 17px; line-height: 1.45; letter-spacing: -.02em; }
p { margin: 0; }
ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.footer { display: flex; flex-wrap: wrap; gap: 16px 32px; padding-block: 28px; border-top: 1px solid var(--line); color: var(--ink-50); }
@media (max-width: 899px) {
  .doc { grid-template-columns: 1fr; gap: 40px; padding-block: 48px 80px; }
  .doc-aside { position: static; }
}
</style>
</head>
<body>
<div class="page">
  <main class="doc" style="grid-template-columns:1fr;min-height:70vh;align-content:center">
    <div class="doc-aside" style="position:static">
      <span class="eyebrow">Помилка 404</span>
      <h1>Сторінку не&nbsp;знайдено</h1>
      <p class="meta">Можливо, посилання застаріло. Головна сторінка на місці.</p>
      <a class="btn" href="/">
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 9H3m0 0 5-5M3 9l5 5"/></svg></span>
        <span class="label">На головну</span>
      </a>
    </div>
  </main>
</div>
</body>
</html>
